spring:
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  resilience4j:
    ratelimiter:
      instances:
        postPutLimiter:
          limit-for-period: 2
          limit-refresh-period: 1s
          timeout-duration: 0s

    bulkhead:
      instances:
        getDeleteLimiter:
          max-concurrent-calls: 5
        max-wait-duration: 0s

server:
  port: 8080